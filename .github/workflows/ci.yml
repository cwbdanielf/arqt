name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Sintaxe de todos os módulos
        shell: bash
        run: find skills tests tools -name '*.mjs' -o -name '*.js' | xargs -n1 node --check
      - name: Integridade (CHECKSUMS.txt atualizado)
        run: node skills/arqt/scripts/build.mjs --check
      - name: Testes
        run: node --test "tests/**/*.test.mjs"
