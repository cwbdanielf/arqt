name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Sintaxe de todos os módulos
        shell: bash
        run: find skills tests tools -name '*.mjs' -o -name '*.js' | xargs -n1 node --check
      - name: Integridade (CHECKSUMS.txt atualizado)
        run: node skills/arqt/scripts/build.mjs --check
      - name: Testes
        run: node --test "tests/**/*.test.mjs"
